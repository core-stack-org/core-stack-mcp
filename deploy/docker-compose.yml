# Production stack. Run from the repository root:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: corestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: corestack_mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corestack -d corestack_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql+asyncpg://corestack:${POSTGRES_PASSWORD}@db:5432/corestack_mcp
      CORE_STACK_BASE_URL: ${CORE_STACK_BASE_URL:-https://geoserver.core-stack.org}
      CORE_STACK_API_KEY: ${CORE_STACK_API_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_HOST}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      # Host ports 80 and 443 are already in use on the server.
      - "8094:80"
      - "8494:443"
    environment:
      MCP_HOST: ${MCP_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
