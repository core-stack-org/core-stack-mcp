[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-stack-mcp"
version = "0.1.0"
description = "FastAPI MCP server for the CoRE Stack public API, with Postgres access logs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
